name: Quality

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Odoo addon statically
        run: python3 .github/scripts/validate_addon.py
      - name: Compile addon Python files
        run: python3 -m compileall -q odoo_agent
